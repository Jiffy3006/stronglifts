<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StrongLifts 5x5 Tracker PWA</title>
  
  <!-- PWA Web App Manifest (Inline via Data URI) -->
  <link rel="manifest" id="pwa-manifest">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & Babel Single File Stack -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    -webkit-tap-highlight-color: transparent;
    body {
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    input, select, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <div id="root"></div>

  <!-- Inline Web Manifest Generator -->
  <script>
    const manifestData = {
      "name": "StrongLifts 5x5 Offline",
      "short_name": "SL 5x5",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#0f172a",
      "theme_color": "#ea580c",
      "icons": [
        {
          "src": "https://img.icons8.com/isometric/192/barbell.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "https://img.icons8.com/isometric/512/barbell.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('pwa-manifest').setAttribute('href', manifestURL);
  </script>

  <!-- Service Worker Registration for Complete Offline Support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'sl5x5-v3';
          const urlsToCache = [
            './',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/lucide@latest',
            'https://unpkg.com/react@18/umd/react.production.min.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
            'https://unpkg.com/babel-standalone@6/babel.min.js'
          ];

          self.addEventListener('install', event => {
            event.waitUntil(
              caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
            );
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil(caches.claim());
          });

          self.addEventListener('fetch', event => {
            event.respondWith(
              caches.match(event.request).then(response => {
                return response || fetch(event.request).catch(() => caches.match('./'));
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>

  <!-- Application Logic Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default StrongLifts Core Standard Weights
    const DEFAULT_WEIGHTS = {
      squat: 40,
      bench: 30,
      row: 30,
      ohp: 20,
      deadlift: 50
    };

    // Default Exercise Custom Names
    const DEFAULT_NAMES = {
      squat: 'Kniebeugen (Squat)',
      bench: 'Bankdrücken (Bench Press)',
      row: 'Langhantelrudern (Barbell Row)',
      ohp: 'Schulterdrücken (OHP)',
      deadlift: 'Kreuzheben (Deadlift)'
    };

    const DEFAULT_ASSISTANCE = [
      { id: 'dips', name: 'Dips (Eigengewicht)', sets: 3, targetReps: 10, weight: 0 },
      { id: 'pullups', name: 'Klimmzüge (Pull-Ups)', sets: 3, targetReps: 8, weight: 0 },
      { id: 'facepulls', name: 'Face Pulls (Kabelzug)', sets: 3, targetReps: 12, weight: 15 },
      { id: 'curls', name: 'Bizeps Curls', sets: 3, targetReps: 10, weight: 10 },
      { id: 'plank', name: 'Plank (Bauch)', sets: 3, targetReps: 60, weight: 0 }
    ];

    const INCREMENTS = {
      squat: 2.5,
      bench: 2.5,
      row: 2.5,
      ohp: 2.5,
      deadlift: 5.0
    };

    const WORKOUT_DEFS = {
      A: [
        { id: 'squat', sets: 5, targetReps: 5 },
        { id: 'bench', sets: 5, targetReps: 5 },
        { id: 'row', sets: 5, targetReps: 5 }
      ],
      B: [
        { id: 'squat', sets: 5, targetReps: 5 },
        { id: 'ohp', sets: 5, targetReps: 5 },
        { id: 'deadlift', sets: 1, targetReps: 5 }
      ]
    };

    // Audio Beep Generator using Web Audio API
    const playBeep = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
        if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
      } catch (e) {
        console.error("Audio error:", e);
      }
    };

    function App() {
      // App Navigation & Core State
      const [view, setView] = useState('dashboard'); // 'dashboard', 'workout', 'history', 'settings', 'assistance'
      
      const [exerciseNames, setExerciseNames] = useState(() => {
        const saved = localStorage.getItem('sl5x5_exercise_names');
        return saved ? JSON.parse(saved) : DEFAULT_NAMES;
      });

      const [weights, setWeights] = useState(() => {
        const saved = localStorage.getItem('sl5x5_weights');
        return saved ? JSON.parse(saved) : DEFAULT_WEIGHTS;
      });

      const [assistanceList, setAssistanceList] = useState(() => {
        const saved = localStorage.getItem('sl5x5_assistance_list');
        return saved ? JSON.parse(saved) : DEFAULT_ASSISTANCE;
      });

      const [nextWorkout, setNextWorkout] = useState(() => {
        return localStorage.getItem('sl5x5_next_type') || 'A';
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('sl5x5_history');
        return saved ? JSON.parse(saved) : [];
      });

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('sl5x5_settings');
        return saved ? JSON.parse(saved) : { autoTimer: true, defaultRest: 90, autoIncrement: true };
      });

      // Live Workout Session State
      const [activeSession, setActiveSession] = useState(null);

      // Timer State
      const [timerSec, setTimerSec] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);
      const [timerConfig, setTimerConfig] = useState(settings.defaultRest);

      // Modals
      const [editingExerciseKey, setEditingExerciseKey] = useState(null);
      const [tempExerciseName, setTempExerciseName] = useState('');
      
      // New Assistance Creation State
      const [showAddAssistanceModal, setShowAddAssistanceModal] = useState(false);
      const [newAssist, setNewAssist] = useState({ name: '', sets: 3, targetReps: 10, weight: 0 });

      // Selector for Adding Assistance during Workout
      const [showAttachAssistanceModal, setShowAttachAssistanceModal] = useState(false);

      // Persistence Effects
      useEffect(() => {
        localStorage.setItem('sl5x5_exercise_names', JSON.stringify(exerciseNames));
      }, [exerciseNames]);

      useEffect(() => {
        localStorage.setItem('sl5x5_weights', JSON.stringify(weights));
      }, [weights]);

      useEffect(() => {
        localStorage.setItem('sl5x5_assistance_list', JSON.stringify(assistanceList));
      }, [assistanceList]);

      useEffect(() => {
        localStorage.setItem('sl5x5_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('sl5x5_next_type', nextWorkout);
      }, [nextWorkout]);

      useEffect(() => {
        localStorage.setItem('sl5x5_settings', JSON.stringify(settings));
      }, [settings]);

      // Refresh Lucide Icons on view/state changes
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [view, activeSession, timerRunning, editingExerciseKey, showAddAssistanceModal, showAttachAssistanceModal]);

      // Timer countdown effect
      useEffect(() => {
        let interval = null;
        if (timerRunning && timerSec > 0) {
          interval = setInterval(() => setTimerSec(prev => prev - 1), 1000);
        } else if (timerSec === 0 && timerRunning) {
          setTimerRunning(false);
          playBeep();
        }
        return () => clearInterval(interval);
      }, [timerRunning, timerSec]);

      // Start Core Workout (A or B or Pure Assistance)
      const startWorkout = (type) => {
        let exercises = [];

        if (type === 'A' || type === 'B') {
          exercises = WORKOUT_DEFS[type].map(ex => {
            const currentWeight = weights[ex.id] || DEFAULT_WEIGHTS[ex.id];
            const currentName = exerciseNames[ex.id] || DEFAULT_NAMES[ex.id];
            return {
              ...ex,
              isAssistance: false,
              name: currentName,
              weight: currentWeight,
              completedSets: Array(ex.sets).fill(ex.targetReps)
            };
          });
        }

        setActiveSession({
          type,
          startTime: new Date().toISOString(),
          exercises
        });
        setView('workout');
      };

      // Add dynamic assistance exercise to active session
      const attachAssistanceToSession = (assistEx) => {
        if (!activeSession) return;
        const exists = activeSession.exercises.some(e => e.id === assistEx.id);
        if (exists) return;

        const newEx = {
          id: assistEx.id,
          isAssistance: true,
          name: assistEx.name,
          sets: assistEx.sets,
          targetReps: assistEx.targetReps,
          weight: assistEx.weight,
          completedSets: Array(assistEx.sets).fill(assistEx.targetReps)
        };

        setActiveSession({
          ...activeSession,
          exercises: [...activeSession.exercises, newEx]
        });
        setShowAttachAssistanceModal(false);
      };

      // Remove an exercise from the active session
      const removeExerciseFromSession = (exIdx) => {
        setActiveSession(prev => ({
          ...prev,
          exercises: prev.exercises.filter((_, idx) => idx !== exIdx)
        }));
      };

      // Rep Button Click Logic
      const handleRepClick = (exIndex, setIndex) => {
        setActiveSession(prev => {
          const newExs = [...prev.exercises];
          const curReps = newExs[exIndex].completedSets[setIndex];
          const target = newExs[exIndex].targetReps;
          const nextReps = curReps === 0 ? target : curReps - 1;
          newExs[exIndex].completedSets[setIndex] = nextReps;
          return { ...prev, exercises: newExs };
        });

        if (settings.autoTimer) {
          startTimer(timerConfig);
        }
      };

      const startTimer = (seconds) => {
        setTimerSec(seconds);
        setTimerRunning(true);
      };

      const toggleTimer = () => {
        setTimerRunning(!timerRunning);
      };

      // Save Workout Session
      const finishWorkout = () => {
        const completedDate = new Date().toISOString();
        const workoutRecord = {
          id: Date.now(),
          date: completedDate,
          type: activeSession.type,
          exercises: activeSession.exercises
        };

        // Determine core weight increases & update last assistance weights
        const updatedWeights = { ...weights };
        const updatedAssistance = [...assistanceList];

        activeSession.exercises.forEach(ex => {
          if (!ex.isAssistance && settings.autoIncrement) {
            const allPassed = ex.completedSets.every(reps => reps === ex.targetReps);
            if (allPassed) {
              const inc = INCREMENTS[ex.id] || 2.5;
              updatedWeights[ex.id] = (updatedWeights[ex.id] || DEFAULT_WEIGHTS[ex.id]) + inc;
            }
          } else if (ex.isAssistance) {
            // Update assistance weight in pool if changed
            const assistIdx = updatedAssistance.findIndex(a => a.id === ex.id);
            if (assistIdx !== -1) {
              updatedAssistance[assistIdx].weight = ex.weight;
            }
          }
        });

        setWeights(updatedWeights);
        setAssistanceList(updatedAssistance);
        setHistory([workoutRecord, ...history]);
        
        if (activeSession.type === 'A') setNextWorkout('B');
        else if (activeSession.type === 'B') setNextWorkout('A');

        setActiveSession(null);
        setTimerRunning(false);
        setView('dashboard');
      };

      // Exercise Renaming Logic
      const openRenameModal = (key) => {
        setEditingExerciseKey(key);
        setTempExerciseName(exerciseNames[key] || DEFAULT_NAMES[key] || key);
      };

      const saveExerciseRename = () => {
        if (!editingExerciseKey || !tempExerciseName.trim()) return;
        
        // Check if core
        if (DEFAULT_NAMES[editingExerciseKey] || exerciseNames[editingExerciseKey]) {
          setExerciseNames({ ...exerciseNames, [editingExerciseKey]: tempExerciseName.trim() });
        }

        // Check if assistance
        setAssistanceList(prev => prev.map(a => a.id === editingExerciseKey ? { ...a, name: tempExerciseName.trim() } : a));

        // Update active session if running
        if (activeSession) {
          const updatedExs = activeSession.exercises.map(ex => 
            ex.id === editingExerciseKey ? { ...ex, name: tempExerciseName.trim() } : ex
          );
          setActiveSession({ ...activeSession, exercises: updatedExs });
        }

        setEditingExerciseKey(null);
      };

      // Assistance Exercise CRUD
      const createAssistanceExercise = () => {
        if (!newAssist.name.trim()) return;
        const newObj = {
          id: 'assist_' + Date.now(),
          name: newAssist.name.trim(),
          sets: parseInt(newAssist.sets) || 3,
          targetReps: parseInt(newAssist.targetReps) || 10,
          weight: parseFloat(newAssist.weight) || 0
        };
        setAssistanceList([...assistanceList, newObj]);
        setNewAssist({ name: '', sets: 3, targetReps: 10, weight: 0 });
        setShowAddAssistanceModal(false);
      };

      const deleteAssistanceExercise = (id) => {
        setAssistanceList(assistanceList.filter(a => a.id !== id));
      };

      // Export CSV Data
      const exportCSV = () => {
        let csv = 'Datum,Workout,Uebung,Typ,Satz_Nr,Wiederholungen,Gewicht_KG\n';
        history.forEach(item => {
          const dateStr = new Date(item.date).toLocaleDateString('de-DE');
          item.exercises.forEach(ex => {
            const exType = ex.isAssistance ? 'Assistenz' : 'Hauptuebung';
            ex.completedSets.forEach((reps, setIdx) => {
              csv += `"${dateStr}","Workout ${item.type}","${ex.name}","${exType}",${setIdx + 1},${reps},${ex.weight}\n`;
            });
          });
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `stronglifts_export_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      };

      // Export JSON Backup
      const exportJSON = () => {
        const data = { history, weights, exerciseNames, assistanceList, nextWorkout, settings };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `stronglifts_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      // Import JSON Backup
      const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.history) setHistory(data.history);
            if (data.weights) setWeights(data.weights);
            if (data.exerciseNames) setExerciseNames(data.exerciseNames);
            if (data.assistanceList) setAssistanceList(data.assistanceList);
            if (data.nextWorkout) setNextWorkout(data.nextWorkout);
            if (data.settings) setSettings(data.settings);
            alert("Sicherung erfolgreich wiederhergestellt!");
          } catch (err) {
            alert("Fehler beim Importieren der Datei.");
          }
        };
        reader.readAsText(file);
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      return (
        <div className="flex flex-col min-h-screen max-w-md mx-auto bg-slate-900 border-x border-slate-800 shadow-2xl relative">
          {/* Header */}
          <header className="p-4 bg-slate-800/80 backdrop-blur sticky top-0 z-30 border-b border-slate-700 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <div className="bg-brand-600 p-2 rounded-xl text-white">
                <i data-lucide="dumbbell" className="w-5 h-5"></i>
              </div>
              <h1 className="font-bold text-lg tracking-tight text-white">StrongLifts 5x5</h1>
            </div>
            <span className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-mono">Offline</span>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 p-4 pb-24 overflow-y-auto">
            
            {/* VIEW: DASHBOARD */}
            {view === 'dashboard' && (
              <div className="space-y-6">
                {/* Next Core Workout Recommendation */}
                <div className="bg-gradient-to-br from-brand-600 to-brand-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                  <div className="relative z-10">
                    <span className="bg-black/20 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-semibold">Empfohlenes Rhythmus-Workout</span>
                    <h2 className="text-3xl font-extrabold mt-2">Workout {nextWorkout}</h2>
                    
                    <ul className="mt-3 space-y-1.5 text-brand-100 text-sm font-medium">
                      {WORKOUT_DEFS[nextWorkout].map(ex => (
                        <li key={ex.id} className="flex justify-between items-center bg-black/10 px-3 py-1.5 rounded-lg">
                          <span>{exerciseNames[ex.id] || DEFAULT_NAMES[ex.id]}</span>
                          <span className="font-bold text-white">{weights[ex.id] || DEFAULT_WEIGHTS[ex.id]} kg</span>
                        </li>
                      ))}
                    </ul>

                    <button 
                      onClick={() => startWorkout(nextWorkout)} 
                      className="mt-5 w-full bg-white text-brand-600 font-bold py-3 px-4 rounded-xl shadow hover:bg-brand-50 transition active:scale-[0.98] flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-5 h-5 fill-current"></i>
                      Workout {nextWorkout} Starten
                    </button>
                  </div>
                </div>

                {/* Quick Start Other Workouts & Assistance */}
                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Workout Auswählen</span>
                  <div className="grid grid-cols-3 gap-2">
                    <button 
                      onClick={() => startWorkout('A')}
                      className="p-3 bg-slate-800 rounded-xl border border-slate-700 text-left hover:border-brand-500/50 transition">
                      <div className="text-[10px] text-slate-400 font-semibold uppercase">Haupt-A</div>
                      <div className="text-base font-bold text-white mt-0.5">Workout A</div>
                    </button>
                    <button 
                      onClick={() => startWorkout('B')}
                      className="p-3 bg-slate-800 rounded-xl border border-slate-700 text-left hover:border-brand-500/50 transition">
                      <div className="text-[10px] text-slate-400 font-semibold uppercase">Haupt-B</div>
                      <div className="text-base font-bold text-white mt-0.5">Workout B</div>
                    </button>
                    <button 
                      onClick={() => startWorkout('Assistance')}
                      className="p-3 bg-slate-800 rounded-xl border border-slate-700 text-left hover:border-brand-500/50 transition">
                      <div className="text-[10px] text-brand-400 font-semibold uppercase">Frei / Extra</div>
                      <div className="text-base font-bold text-brand-400 mt-0.5">+ Assistenz</div>
                    </button>
                  </div>
                </div>

                {/* Custom Assistance Pool Preview */}
                <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                      <i data-lucide="plus-circle" className="w-4 h-4 text-brand-500"></i>
                      <span>Assistenzübungen</span>
                    </h3>
                    <button onClick={() => setView('assistance')} className="text-xs text-brand-500 font-bold">Verwalten ({assistanceList.length})</button>
                  </div>
                  <div className="grid grid-cols-1 gap-2">
                    {assistanceList.slice(0, 4).map(item => (
                      <div key={item.id} className="flex justify-between items-center p-2.5 bg-slate-900/50 rounded-xl text-xs">
                        <span className="text-slate-200 font-medium">{item.name}</span>
                        <span className="text-slate-400 font-mono">{item.sets}x{item.targetReps} @ <strong className="text-brand-500">{item.weight}kg</strong></span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Current Main Weights Overview */}
                <div className="bg-slate-800 rounded-2xl p-4 border border-slate-700">
                  <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span>Hauptübungen (5x5)</span>
                    <button onClick={() => setView('settings')} className="text-xs text-brand-500 font-normal">Anpassen</button>
                  </h3>
                  <div className="space-y-2">
                    {Object.entries(weights).map(([key, val]) => (
                      <div key={key} className="flex justify-between items-center p-2.5 bg-slate-900/50 rounded-xl">
                        <div className="flex items-center gap-2 overflow-hidden">
                          <button 
                            onClick={() => openRenameModal(key)}
                            className="text-slate-400 hover:text-brand-500 p-1" 
                            title="Übung umbenennen">
                            <i data-lucide="pencil" className="w-3.5 h-3.5"></i>
                          </button>
                          <span className="text-sm text-slate-200 font-medium truncate">
                            {exerciseNames[key] || DEFAULT_NAMES[key]}
                          </span>
                        </div>
                        <span className="text-sm font-mono font-bold text-brand-500 shrink-0">{val} kg</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: LIVE WORKOUT SESSION */}
            {view === 'workout' && activeSession && (
              <div className="space-y-6">
                <div className="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-semibold">Aktives Training</span>
                    <h2 className="text-xl font-bold text-white">Workout {activeSession.type}</h2>
                  </div>
                  <button

      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
